name: Contract change
description: Propose a preset, workflow, rule, or core contract change.
title: "[contract] "
labels:
  - contract
body:
  - type: dropdown
    id: contract_type
    attributes:
      label: Contract type
      options:
        - preset
        - workflow
        - review-rule
        - core-enum
        - document-type
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - patch
        - minor
        - major
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change
      description: Describe the new or updated contract.
    validations:
      required: true
  - type: textarea
    id: products
    attributes:
      label: Products
      description: List affected products or external distributors.
      placeholder: plomus-commerce-ai-os, external distributor name
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Note which local or product tests should pass.
      placeholder: pnpm run check:update, product adapter tests
